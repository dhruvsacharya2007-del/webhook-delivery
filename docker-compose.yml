
services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook_postgres
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook_db
    ports:
      - "5432:5432"
    volumes:
      - webhook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: webhook_migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://webhook:webhook@postgres:5432/webhook_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: webhook_api
    command: node src/server.js
    environment:
      DATABASE_URL: postgresql://webhook:webhook@postgres:5432/webhook_db?schema=public
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: node src/worker.js
    environment:
      DATABASE_URL: postgresql://webhook:webhook@postgres:5432/webhook_db?schema=public
      NODE_ENV: production
      LOG_LEVEL: info
      WEBHOOK_TIMEOUT_MS: 10000
      BACKOFF_BASE_MS: 5000
      MAX_DELIVERY_ATTEMPTS: 6
      VISIBILITY_TIMEOUT_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2


  receiver:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./receiver:/app:ro
    command: node index.js
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      WEBHOOK_SECRET: ${RECEIVER_SECRET:-}
      FLAKY_FAILURES: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  webhook_pgdata: