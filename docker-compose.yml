services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook_postgres
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook_db
    ports:
      - "5432:5432"
    volumes:
      - webhook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  webhook_pgdata: